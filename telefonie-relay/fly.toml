app = "eilersfriends-voice"
primary_region = "fra"

[build]

[env]
  AGENT_BASE = "https://www.eilersfriends.com/voice"
  PUBLIC_HOST = "eilersfriends-voice.fly.dev"
  TTS_LANGUAGE = "de-DE"
  TTS_VOICE_STRATEGY = "a"
  TTS_VOICE_A = "SiMvlSW9cKKHDYT4BzOp"
  TTS_VOICE_B = "E77N7V3flAUuuy7eDa10"
  TTS_VOICE_MATILDA = "XrExE9yKIg1WjnnlVkGX"
  TTS_NAME_A = "Eilisabet"
  TTS_NAME_B = "Eilexander"
  TTS_NAME_MATILDA = "Eilisabet"
  TTS_FALLBACK_PROVIDER = "Google"
  TTS_FALLBACK_VOICE = "de-DE-Chirp3-HD-Leda"
  # ELEVENLABS_API_KEY als Fly-Secret setzen (flyctl secrets set ELEVENLABS_API_KEY=...)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
